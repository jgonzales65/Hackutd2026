version: '3.8'
services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: terraintel_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: terraintel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  airflow:
    image: apache/airflow:2.10.5
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://cascade:cascade@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      WAREHOUSE_DSN: postgresql://cascade:cascade@postgres:5432/cascade
      SEED_CSV: /opt/airflow/data/bexar_seed.csv
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
    command: >
      bash -c "airflow db migrate &&
      (airflow users create --username airflow --password airflow --firstname a --lastname b --role Admin --email a@b.c || true) &&
      (airflow scheduler &) && exec airflow webserver"
volumes:
  pgdata: